min_version = "2024.9.5"

[env]
# Use the project name derived from the current directory
PROJECT_NAME = "evlogger"
MONGODB_URL ="mongodb://mongo:27017/chargelogger"
API_SECRET_KEY ="dev-only-insecure-key-never-use-in-production" # local dev/tests only
API_ALGORITHM ="HS256"
API_ACCESS_TOKEN_EXPIRE_MINUTES ="129600" # 90 days

# Automatic virtualenv activation
_.python.venv = { path = ".venv" }

[tasks.run]
description = "Run the application"
run = "python app.py"

[tasks.test]
description = "Run tests"
run = "pytest tests/"

[tasks.format]
description = "Format and fix linting"
run = "ruff format . && ruff check --fix ."

[tasks.lint]
description = "Check linting only"
run = "ruff check ."

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "Virtual Environment: $VIRTUAL_ENV"
'''
