[project]
name = "evlogger"
version = "0.1.0"
description = ""
authors = [{ name = "Demian", email = "ict1986@gmail.com" }]
requires-python = "==3.12.*"
readme = "README.md"
dependencies = [
    "fastapi>=0.100.0,<0.200.0",
    "bcrypt>=4.0.1,<5",
    "passlib>=1.7.4,<2",
    "python-multipart>=0.0.6,<0.1.0",
    "uvicorn>=0.23.0,<0.24",
    "gunicorn>=20.1.0,<21",
    "python-jose[cryptography]>=3.3.0,<4",
    "pydantic-extra-types>=2.0.0,<3",
    "motor>=3.2.0,<4",
    "loguru>=0.7.0,<1.0",
    "shortuuid>=1.0.11,<2",
    "chardet>=5.1.0,<6",
    "dateparser>=1.1.8,<2",
    "pymongo>=4.5.0,<5",
]

[dependency-groups]
dev = [
    "requests>=2.31.0,<3",
    "pytest>=7.4.0,<8",
    "httpx>=0.24.1,<0.25",
    "pytest-cov>=4.1.0,<5",
    "pymongo-inmemory<0.4",
]

[tool.hatch.build.targets.sdist]
include = ["charge_logger"]

[tool.hatch.build.targets.wheel]
include = ["charge_logger"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.ruff]
line-length = 120
indent-width = 4

# Assume Python 3.8
target-version = "py311"

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
