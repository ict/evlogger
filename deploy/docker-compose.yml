# EVLogger behind Caddy with automatic HTTPS.
#   cp .env.example .env    # set EVLOGGER_DOMAIN and API_SECRET_KEY
#   docker compose up -d --build
# Only Caddy publishes ports; the API and MongoDB stay on the internal network.
name: evlogger

services:
  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      EVLOGGER_DOMAIN: ${EVLOGGER_DOMAIN:?Set EVLOGGER_DOMAIN in .env}
      EVLOGGER_ALLOWED_IPS: ${EVLOGGER_ALLOWED_IPS:-private_ranges}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ./docker/Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: ./docker/Dockerfile
    expose:
      - "8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017/chargelogger
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      API_ALGORITHM: HS256
      API_ACCESS_TOKEN_EXPIRE_MINUTES: 129600 # 90 days
      API_ROOT_PATH: /api
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:9.0 # pinned: upgrade MongoDB one major at a time
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
