services:
  api:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    expose:
      - "8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017/chargelogger
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      API_ALGORITHM: HS256
      API_ACCESS_TOKEN_EXPIRE_MINUTES: 129600 # 90 days
      API_ROOT_PATH: /api

  mongo:
    image: mongo:9.0
    ports:
      - "27017:27017"

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
