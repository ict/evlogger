services:
  api:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017/chargelogger
      API_SECRET_KEY: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      API_ALGORITHM: HS256
      API_ACCESS_TOKEN_EXPIRE_MINUTES: 129600 # 90 days

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      CHARGELOGGER_BACKEND: "http://api:8000"
