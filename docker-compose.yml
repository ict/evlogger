# Local quick start: http://localhost:8080, reachable from this machine only.
# For a real server with HTTPS see deploy/.
services:
  api:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    expose:
      - "8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017/chargelogger
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      API_ALGORITHM: HS256
      API_ACCESS_TOKEN_EXPIRE_MINUTES: 129600 # 90 days
      API_ROOT_PATH: /api
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:9.0
    # No authentication: keep it off the network. Uncomment to inspect it locally with mongosh/Compass.
    # ports:
    #   - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
