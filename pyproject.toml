[tool.poetry]
name = "charge-logger"
version = "0.1.0"
description = ""
authors = ["Demian <ict1986@gmail.com>"]
readme = "README.md"
packages = [{include = "charge_logger"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
bcrypt = "^4.0.1"
passlib = "^1.7.4"
python-multipart = "^0.0.6"
uvicorn = "^0.23.0"
gunicorn = "^20.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pydantic-extra-types = "^2.0.0"
motor = "^3.2.0"
loguru = "^0.7.0"
shortuuid = "^1.0.11"
chardet = "^5.1.0"
dateparser = "^1.1.8"
pymongo = "^4.5.0"


[tool.poetry.group.dev.dependencies]
requests = "^2.31.0"
pytest = "^7.4.0"
httpx = "^0.24.1"
pymongo-inmemory = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
skip-string-normalization = true